services:
  qsm-movie-wall:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1
        VITE_API_KEY: ${API_KEY:-}
    container_name: qsm-movie-wall
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
