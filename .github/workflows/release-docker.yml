name: Release Docker Image

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-release-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_NAME: qsm-movie-wall
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      PLATFORM: linux/amd64
      ASSET_SUFFIX: linux-amd64
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: ${{ env.PLATFORM }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package Docker image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          asset_base="${IMAGE_NAME}-${RELEASE_TAG}-${ASSET_SUFFIX}"
          docker save "${IMAGE_NAME}:${RELEASE_TAG}" | gzip > "release-assets/${asset_base}.tar.gz"
          sha256sum "release-assets/${asset_base}.tar.gz" > "release-assets/${asset_base}.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          overwrite_files: true
          files: |
            release-assets/${{ env.IMAGE_NAME }}-${{ env.RELEASE_TAG }}-${{ env.ASSET_SUFFIX }}.tar.gz
            release-assets/${{ env.IMAGE_NAME }}-${{ env.RELEASE_TAG }}-${{ env.ASSET_SUFFIX }}.tar.gz.sha256
