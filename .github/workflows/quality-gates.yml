name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary --no-compile -r requirements-dev.lock.txt

      - name: Run backend pytest
        run: python -m pytest tests -q -m "not performance"

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: qsm-ci:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke test
        run: |
          docker run -d --rm \
            --name qsm-smoke \
            -p 18000:8000 \
            -e API_KEY=smoke-api-key \
            -e TMDB_API_KEY=smoke-tmdb-key \
            -e QUARK_TRANSFER_COOKIE=smoke-quark-cookie \
            qsm-ci:smoke

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18000/api/v1/health/live >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:18000/api/v1/health/live
          curl -fsS http://127.0.0.1:18000/api/v1/health/ready

      - name: Dump container logs on failure
        if: failure()
        run: docker logs qsm-smoke

      - name: Stop smoke container
        if: always()
        run: docker rm -f qsm-smoke || true

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        env:
          HUSKY: "0"
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint check
        run: pnpm run lint:check

      - name: Run frontend format check
        run: pnpm run format:check

      - name: Run frontend tests with coverage
        run: pnpm run test:coverage

      - name: Build frontend
        run: pnpm run build

      - name: Upload frontend coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-summary
          path: frontend/coverage/coverage-summary.json
          if-no-files-found: ignore
