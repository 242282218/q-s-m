{% extends "base.html" %}

{% block content %}
<div class="page">
  <section class="section" aria-labelledby="settings-title">
    <div class="section-header">
      <span class="section-icon" aria-hidden="true">⚙️</span>
      <h2 class="section-title" id="settings-title">系统设置</h2>
    </div>

    <div class="settings-container">
      <p class="settings-desc">修改配置后可能需要重启服务才能生效。</p>

      <form id="settingsForm" class="settings-form">
        <!-- 基础配置 -->
        <div class="settings-section">
          <h3 class="settings-section-title">基础配置</h3>
          <div class="form-group">
            <label for="TMDB_API_KEY">TMDB API Key</label>
            <input type="text" id="TMDB_API_KEY" name="TMDB_API_KEY" value="{{ settings.tmdb_api_key }}" required placeholder="输入您的 TMDB API Key">
            <small>用于获取影视元数据，可在 <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">TMDB 官网</a> 申请</small>
          </div>
          <div class="form-group">
            <label for="HTTP_PROXY">HTTP 代理</label>
            <input type="text" id="HTTP_PROXY" name="HTTP_PROXY" value="{{ settings.http_proxy or '' }}" placeholder="http://127.0.0.1:7890">
            <small>访问 TMDB API 可能需要代理，留空则不使用代理</small>
          </div>
          <div class="form-group">
            <label for="LOG_LEVEL">日志级别</label>
            <select id="LOG_LEVEL" name="LOG_LEVEL">
              <option value="DEBUG" {% if settings.log_level == 'DEBUG' %}selected{% endif %}>DEBUG - 调试</option>
              <option value="INFO" {% if settings.log_level == 'INFO' %}selected{% endif %}>INFO - 信息</option>
              <option value="WARNING" {% if settings.log_level == 'WARNING' %}selected{% endif %}>WARNING - 警告</option>
              <option value="ERROR" {% if settings.log_level == 'ERROR' %}selected{% endif %}>ERROR - 错误</option>
            </select>
          </div>
        </div>

        <!-- 夸克网盘配置 -->
        <div class="settings-section">
          <h3 class="settings-section-title">夸克网盘配置</h3>
          <div class="form-group">
            <label for="QUARK_TRANSFER_COOKIE">Cookie</label>
            <textarea id="QUARK_TRANSFER_COOKIE" name="QUARK_TRANSFER_COOKIE" rows="4" placeholder="输入夸克网盘 Cookie">{{ settings.quark_cookie }}</textarea>
            <small>用于转存和管理网盘资源，请从浏览器开发者工具中复制 Cookie</small>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">保存配置</button>
        </div>
      </form>
    </div>
  </section>
</div>

<script>
document.getElementById('settingsForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const submitBtn = e.target.querySelector('button[type="submit"]');
  const originalText = submitBtn.textContent;
  submitBtn.textContent = '保存中...';
  submitBtn.disabled = true;

  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData.entries());

  // Convert empty strings to null for optional fields
  for (const key in data) {
    if (data[key] === '') {
      data[key] = null;
    }
  }

  try {
    const response = await fetch('/api/settings/update', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(data),
    });

    const result = await response.json();

    if (response.ok) {
      submitBtn.textContent = '保存成功!';
      submitBtn.classList.add('btn-success');
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    } else {
      submitBtn.textContent = '保存失败';
      submitBtn.classList.add('btn-error');
      alert('保存失败: ' + (result.detail || result.message));
      setTimeout(() => {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
        submitBtn.classList.remove('btn-error');
      }, 2000);
    }
  } catch (error) {
    submitBtn.textContent = '保存失败';
    submitBtn.classList.add('btn-error');
    alert('保存失败: ' + error.message);
    setTimeout(() => {
      submitBtn.textContent = originalText;
      submitBtn.disabled = false;
      submitBtn.classList.remove('btn-error');
    }, 2000);
  }
});
</script>
{% endblock %}
