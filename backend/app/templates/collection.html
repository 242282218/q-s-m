{% extends "base.html" %}

{% block content %}
<div class="page">
    <section class="section">
        <div class="section-header">
            <span class="section-icon">⭐</span>
            <h2 class="section-title">我的收藏</h2>
            <span class="collection-count" id="collection-count"></span>
        </div>

        <div id="collection-container">
            <div class="loading" id="collection-loading">
                <div class="loading-spinner"></div>
                <span>加载中...</span>
            </div>

            <div class="empty" id="collection-empty" style="display: none;">
                <div class="empty-icon">📦</div>
                <div class="empty-text">暂无收藏</div>
                <div class="empty-hint">在影片详情页点击"收藏"按钮添加收藏</div>
                <a href="/" class="btn-primary">浏览影片</a>
            </div>

            <div class="posters-grid" id="collection-grid" style="display: none;"></div>

            <div class="pagination" id="collection-pagination" style="display: none;">
                <button class="btn-page" id="prev-page" disabled>上一页</button>
                <span class="page-info" id="page-info"></span>
                <button class="btn-page" id="next-page">下一页</button>
            </div>
        </div>
    </section>

    <!-- Playback Options Modal -->
    <div id="play-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closePlayModal()">&times;</button>
            <h3 class="modal-title">选择播放方式</h3>
            <div class="modal-actions">
                <a id="btn-play-browser" href="#" target="_blank" class="modal-btn browser">
                    <span class="icon">🌏</span> 浏览器播放
                </a>
                <a id="btn-play-mpv" href="#" class="modal-btn mpv">
                    <span class="icon">🎬</span> 本地播放 (MPV)
                </a>
            </div>
            <div class="modal-footer">
                <div class="link-copy-box">
                    <input type="text" id="webdav-link" readonly value="http://..." onclick="this.select()">
                    <button onclick="copyWebDAVLink()">复制链接</button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .collection-count {
        margin-left: 12px;
        background: rgba(229, 9, 20, 0.2);
        color: #e50914;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
    }

    .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        color: #888;
    }

    .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #e50914;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 20px;
        text-align: center;
    }

    .empty-icon {
        font-size: 64px;
        margin-bottom: 20px;
        opacity: 0.5;
    }

    .empty-text {
        font-size: 20px;
        color: #fff;
        margin-bottom: 8px;
    }

    .empty-hint {
        font-size: 14px;
        color: #888;
        margin-bottom: 24px;
    }

    .btn-primary {
        display: inline-block;
        background: linear-gradient(135deg, #e50914, #b20710);
        color: white;
        padding: 12px 28px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(229, 9, 20, 0.4);
    }

    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 40px;
        padding: 20px 0;
    }

    .btn-page {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 10px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s ease;
    }

    .btn-page:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.2);
    }

    .btn-page:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .page-info {
        color: #888;
        font-size: 14px;
    }

    /* 收藏卡片覆层 - 删除按钮 */
    .poster-card {
        position: relative;
    }

    .poster-card .delete-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 32px;
        height: 32px;
        background: rgba(0, 0, 0, 0.7);
        border: none;
        border-radius: 50%;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        opacity: 0;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        pointer-events: auto;
        /* 确保可点击 */
    }

    /* 播放按钮 */
    .poster-card .play-btn,
    .poster-card .transfer-btn {
        position: absolute;
        bottom: 70px;
        /* 位于标题上方 */
        right: 8px;
        width: 40px;
        height: 40px;
        background: #e50914;
        /* Netflix Red */
        border: none;
        border-radius: 50%;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        opacity: 0;
        transform: scale(0.8);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        padding-left: 2px;
        /* 视觉校正 */
        pointer-events: auto;
        /* 确保可点击 */
    }

    .poster-card .transfer-btn {
        background: #28a745;
        /* Green for transfer */
        padding-left: 0;
    }

    .poster-card:hover .delete-btn,
    .poster-card:hover .play-btn,
    .poster-card:hover .transfer-btn {
        opacity: 1;
    }

    .poster-card:hover .play-btn,
    .poster-card:hover .transfer-btn {
        transform: scale(1);
    }

    .poster-card .play-btn:hover {
        transform: scale(1.1);
        background: #f40612;
    }

    .poster-card .transfer-btn:hover {
        transform: scale(1.1);
        background: #218838;
    }

    .poster-card .delete-btn:hover {
        background: #e50914;
        transform: scale(1.1);
    }

    /* 状态徽章 */
    .status-badge {
        position: absolute;
        top: 8px;
        left: 8px;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        z-index: 5;
    }

    .status-badge.transferred {
        background: rgba(40, 167, 69, 0.9);
        color: white;
    }

    .status-badge.expired {
        background: rgba(220, 53, 69, 0.9);
        color: white;
    }

    /* Modal Styles */
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(5px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.2s ease;
    }

    .modal-content {
        background: #181818;
        padding: 30px;
        border-radius: 12px;
        width: 90%;
        max-width: 400px;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .modal-close {
        position: absolute;
        top: 10px;
        right: 15px;
        background: none;
        border: none;
        color: #888;
        font-size: 28px;
        cursor: pointer;
    }

    .modal-close:hover {
        color: #fff;
    }

    .modal-title {
        margin: 0 0 24px 0;
        text-align: center;
        font-size: 20px;
    }

    .modal-actions {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .modal-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.2s;
        color: white;
    }

    .modal-btn:hover {
        transform: scale(1.02);
    }

    .modal-btn.browser {
        background: linear-gradient(135deg, #007bff, #0056b3);
    }

    .modal-btn.mpv {
        background: linear-gradient(135deg, #6f42c1, #59359a);
    }

    .modal-footer {
        margin-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 16px;
    }

    .link-copy-box {
        display: flex;
        gap: 8px;
    }

    .link-copy-box input {
        flex: 1;
        background: #000;
        border: 1px solid #333;
        color: #888;
        padding: 8px;
        border-radius: 4px;
        font-size: 12px;
    }

    .link-copy-box button {
        background: #333;
        color: #fff;
        border: none;
        padding: 0 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
    }

    .link-copy-box button:hover {
        background: #444;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }
</style>

<script>
    let currentPage = 1;
    const limit = 20;
    let totalItems = 0;

    async function loadCollections(page = 1) {
        const loading = document.getElementById('collection-loading');
        const empty = document.getElementById('collection-empty');
        const grid = document.getElementById('collection-grid');
        const pagination = document.getElementById('collection-pagination');
        const countEl = document.getElementById('collection-count');

        loading.style.display = 'flex';
        empty.style.display = 'none';
        grid.style.display = 'none';
        pagination.style.display = 'none';

        try {
            // 发送请求到 API，添加超时设置
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000); // 10秒超时
            
            const response = await fetch(`/api/collection/list?page=${page}&limit=${limit}&sort_by=saved_at&order=desc`, {
                signal: controller.signal
            });
            
            clearTimeout(timeoutId);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            // 解析响应数据
            const data = await response.json();
            
            // 隐藏加载状态
            loading.style.display = 'none';

            // 处理没有收藏数据的情况
            if (!data.items || data.total === 0) {
                empty.style.display = 'flex';
                countEl.textContent = '';
                return;
            }

            // 处理收藏数据
            totalItems = data.total;
            currentPage = page;
            countEl.textContent = `${totalItems} 部`;

            // 验证数据格式
            if (!Array.isArray(data.items)) {
                throw new Error('返回数据格式错误: items不是数组');
            }

            // 渲染海报
            grid.innerHTML = data.items.map(item => {
                // 安全处理标题，防止XSS
                const safeTitle = item.title.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                
                // 构建图片URL
                let imageUrl = '';
                if (item.poster_path && item.poster_path.trim()) {
                    // 如果有海报路径，直接使用
                    imageUrl = `https://image.tmdb.org/t/p/w500${item.poster_path}`;
                } else {
                    // 如果没有海报路径，使用占位图
                    imageUrl = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxIiBoZWlnaHQ9IjEiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMzMzMiLz48L3N2Zz4=';
                }
                
                return `
      <div class="poster-card" data-id="${item.id}">
        <button class="delete-btn" onclick="deleteCollection(${item.id}, event)" title="删除收藏">×</button>
        ${item.status === 1
                    ? `<button class="play-btn" onclick="playCollection(${item.id}, event)" title="立即播放">▶</button>`
                    : `<button class="transfer-btn" onclick="transferCollection(${item.id}, event)" title="转存到网盘">📥</button>`
                }
        <a href="/${item.media_type}/${item.tmdb_id}">
          <div class="poster-media">
            <img 
              src="${imageUrl}" 
              alt="${safeTitle}" 
              loading="lazy" 
              onerror="this.onerror=null;this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxIiBoZWlnaHQ9IjEiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMzMzMiLz48L3N2Zz4=';"
              ${!item.poster_path ? `data-tmdb-id="${item.tmdb_id}" data-media-type="${item.media_type}" class="missing-poster"` : ''}
            >
            <div class="poster-gradient"></div>
            ${item.status === 1 ? '<span class="status-badge transferred">已转存</span>' : ''}
            ${item.status === 2 ? '<span class="status-badge expired">已失效</span>' : ''}
          </div>
          <div class="poster-text">
            <div class="poster-title">${safeTitle}</div>
            ${item.year ? `<div class="poster-subtitle">${item.year}</div>` : ''}
          </div>
        </a>
      </div>
    `;
            }).join('');
            
            // 为没有海报的项获取海报
            fetchMissingPosters();

            // 显示海报网格
            grid.style.display = 'grid';

            // 处理分页
            const totalPages = Math.ceil(totalItems / limit);
            if (totalPages > 1) {
                pagination.style.display = 'flex';
                document.getElementById('page-info').textContent = `${page} / ${totalPages}`;
                document.getElementById('prev-page').disabled = page <= 1;
                document.getElementById('next-page').disabled = page >= totalPages;
            }

        } catch (error) {
            // 处理错误
            loading.style.display = 'none';
            empty.style.display = 'flex';
            document.querySelector('.empty-text').textContent = '加载失败';
            document.querySelector('.empty-hint').textContent = error.message;
        }
    }

    async function deleteCollection(id, event) {
        event.preventDefault();
        event.stopPropagation(); // 阻止冒泡

        if (!confirm('确定要删除这个收藏吗？')) {
            return;
        }



        try {
            const response = await fetch(`/api/collection/${id}`, {
                method: 'DELETE'
            });
            const data = await response.json();

            if (data.success) {
                // 重新加载当前页
                loadCollections(currentPage);
            } else {
                alert('删除失败: ' + data.message);
            }
        } catch (error) {
            alert('删除失败: ' + error.message);
        }
    }

    function closePlayModal() {
        document.getElementById('play-modal').style.display = 'none';
    }

    function copyWebDAVLink() {
        const input = document.getElementById('webdav-link');
        input.select();
        document.execCommand('copy');
        alert('链接已复制');
    }

    // Improve transferCollection scoping fix (move out of deleteCollection if nested)
    // Actually the previous file content showed transferCollection was nested inside deleteCollection by mistake?
    // Let's ensure top level functions.

    async function playCollection(id, event) {
        event.preventDefault();
        event.stopPropagation();

        const btn = event.currentTarget;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="loading-spinner" style="width:16px;height:16px;border-width:2px;margin:0;"></span>';
        btn.disabled = true;

        try {
            const response = await fetch('/api/transfer/instant-play', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ collection_id: id })
            });

            const data = await response.json();

            if (data.success) {
                // Show Modal
                const modal = document.getElementById('play-modal');
                const btnBrowser = document.getElementById('btn-play-browser');
                const btnMpv = document.getElementById('btn-play-mpv');
                const linkInput = document.getElementById('webdav-link');

                // Set Links
                btnBrowser.href = data.webdav_url;
                btnMpv.href = data.mpv_url || '#';

                // If MPV URL is not available (e.g. server logic tweak), handle gracefully
                if (!data.mpv_url) {
                    btnMpv.style.opacity = '0.5';
                    btnMpv.onclick = (e) => { e.preventDefault(); alert('MPV 链接生成失败'); };
                } else {
                    btnMpv.style.opacity = '1';
                    btnMpv.onclick = null;
                }

                linkInput.value = data.webdav_url;

                modal.style.display = 'flex';

                // Close modal on outside click
                modal.onclick = (e) => {
                    if (e.target === modal) closePlayModal();
                };

            } else {
                alert('准备播放失败: ' + data.message);
            }
        } catch (error) {
            console.error('播放请求错误:', error);
            alert('请求失败');
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    document.getElementById('prev-page').addEventListener('click', () => {
        if (currentPage > 1) {
            loadCollections(currentPage - 1);
        }
    });

    document.getElementById('next-page').addEventListener('click', () => {
        const totalPages = Math.ceil(totalItems / limit);
        if (currentPage < totalPages) {
            loadCollections(currentPage + 1);
        }
    });

    async function transferCollection(id, event) {
        event.preventDefault();
        event.stopPropagation();

        const btn = event.currentTarget;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="loading-spinner" style="width:16px;height:16px;border-width:2px;margin:0;"></span>';
        btn.disabled = true;

        try {
            const response = await fetch('/api/transfer/exec', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ collection_id: id })
            });

            const data = await response.json();

            if (data.success) {
                alert('转存成功！');
                // 重新加载当前页，更新状态
                loadCollections(currentPage);
            } else {
                alert('转存失败: ' + data.message);
            }
        } catch (error) {
            console.error('转存请求错误:', error);
            alert('转存请求失败');
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    // 为没有海报的项获取海报
    async function fetchMissingPosters() {
        const missingPosters = document.querySelectorAll('.missing-poster');
        if (missingPosters.length === 0) return;
        
        for (const img of missingPosters) {
            const tmdbId = img.dataset.tmdbId;
            const mediaType = img.dataset.mediaType;
            
            if (!tmdbId || !mediaType) continue;
            
            try {
                // 调用后端API获取海报信息，添加超时设置
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000); // 5秒超时
                
                const response = await fetch(`/api/tmdb/details?media_type=${mediaType}&tmdb_id=${tmdbId}`, {
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    console.error(`获取海报失败: ${response.status}`);
                    continue;
                }
                
                const data = await response.json();
                
                if (data.poster_path) {
                    // 更新图片src
                    const posterUrl = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
                    img.src = posterUrl;
                    img.classList.remove('missing-poster');
                    delete img.dataset.tmdbId;
                    delete img.dataset.mediaType;
                }
            } catch (error) {
                console.error(`获取海报时发生错误: ${error.message}`);
            }
        }
    }

    // 页面加载时获取收藏
    document.addEventListener('DOMContentLoaded', () => {
        loadCollections(1);
    });
</script>
{% endblock %}
