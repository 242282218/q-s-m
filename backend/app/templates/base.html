<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nitfix - 影视海报墙，浏览热门电影和剧集，管理您的收藏">
  <meta name="theme-color" content="#0a0a0a">
  <title>{{ page_title or "Nitfix - 影视海报墙" }}</title>
  
  <!-- 预加载关键资源 -->
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="dns-prefetch" href="https://image.tmdb.org">
  
  <!-- 样式表 -->
  <link rel="stylesheet" href="/static/css/main.css">
  
  <!-- 脚本加载优化 -->
  <script src="/static/js/cache.js" defer></script>
  <script src="/static/js/main.js" defer></script>
  
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header" role="banner">
    <div class="shell">
      <div class="brand-area">
        <a class="home-link" href="/" aria-label="返回首页">
          <span>影视墙</span>
        </a>
      </div>
      <form class="search" action="/search" method="get" role="search" aria-label="搜索电影或剧集">
        <input type="text" name="q" value="{{ query | default('', true) }}" placeholder="搜索电影或剧集..." aria-label="搜索关键字" autocomplete="off">
        <button type="submit" aria-label="执行搜索">搜索</button>
      </form>
      <nav class="main-nav" role="navigation" aria-label="主导航">
        <a href="/collection" class="nav-link" aria-label="我的收藏">
          <span>⭐</span>
          <span class="nav-text">收藏</span>
        </a>
        <a href="/settings" class="nav-link" aria-label="系统设置">
          <span>⚙️</span>
          <span class="nav-text">设置</span>
        </a>
      </nav>
    </div>
  </header>

  <main role="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
